name: APK de JARVIS para Android

on:
  push:
    paths: ["jarvis-android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["jarvis-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Compilar la APK
        run: ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
