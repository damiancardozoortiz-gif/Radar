# C.R.D.O. — Cloudflare Tunnel (BORRADOR).
# Recomendado: túnel administrado desde el panel de Cloudflare Zero Trust (solo hace falta TUNNEL_TOKEN).
# Este archivo documenta las rutas equivalentes si se usa un túnel configurado localmente.
tunnel: crdo
ingress:
  - hostname: panel.ejemplo.com
    service: http://caddy:8080
  - hostname: staging.ejemplo.com
    service: http://caddy:8080
  - service: http_status:404
# Cada hostname debe tener una aplicación de Cloudflare Access con política "solo el email del dueño".
