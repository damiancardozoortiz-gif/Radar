# C.R.D.O. — Staging aislado en el mismo servidor (BORRADOR v3). Se combina con compose.yml y staging.env.
#   - Proyecto compose propio (crdo-staging): contenedores, redes (crdo-staging_*) y volúmenes propios.
#   - Base, contraseñas, bucket, llaves y túnel de Cloudflare propios. NUNCA credenciales del canal real.
#   - Topes de CPU/RAM menores: aunque staging se sature, producción conserva sus recursos.
#   - Agentes apagados y presupuesto de IA propio ínfimo.
# Valores en staging.env: CRDO_ENV=staging, CRDO_API_PORT=8100, CRDO_DATA_DIR=/opt/crdo/data/staging,
#   S3_BUCKET=crdo-staging-objects, CRDO_TUNNEL_ENV_FILE=/opt/crdo/secrets/tunnel-staging.env
#
# Presupuesto de memoria del CX33 (8 GB + 2 GB swap), en topes máximos:
#   prod 4,25 GB (pg 2 · api 1 · worker 1 · sched 0,25) + staging 1,9 GB + cloudflared 0,25 GB + SO/Docker ≈ 1 GB

name: crdo-staging

services:
  api:
    mem_limit: 512m
    cpus: 0.5
    environment:
      CRDO_FORBID_PROD_CONNECTIONS: "1"   # la app se niega a arrancar si detecta credenciales marcadas como prod
  worker:
    mem_limit: 512m
    cpus: 0.5
  scheduler:
    mem_limit: 128m
    cpus: 0.1
  postgres:
    mem_limit: 768m
    cpus: 0.75
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
