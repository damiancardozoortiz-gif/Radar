# C.R.D.O. — Servicios base (BORRADOR, Etapa 1). No desplegado.
# Uso previsto:  docker compose -p crdo-prod --env-file /opt/crdo/secrets/prod.env -f compose.yml up -d
# Las versiones de imagen deben fijarse (tag + digest) antes de instalar.

name: crdo-prod

x-app: &app
  image: ghcr.io/${CRDO_GHCR_OWNER:?}/crdo-api:${CRDO_VERSION:?}
  restart: unless-stopped
  env_file: ${CRDO_SECRETS_FILE:?}
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }
  depends_on:
    postgres: { condition: service_healthy }

services:
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:?}
    command: tunnel --no-autoupdate run
    env_file: /opt/crdo/secrets/cloudflared.env   # TUNNEL_TOKEN
    restart: unless-stopped
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  caddy:
    image: caddy:${CADDY_VERSION:?}
    restart: unless-stopped
    environment:
      CRDO_DOMAIN: ${CRDO_DOMAIN:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge, app]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  api:
    <<: *app
    command: ["uvicorn", "crdo.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    networks: [app, data, mcp, egress]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "crdo.jobs.worker"]
    networks: [data, mcp, egress]
    mem_limit: 1g

  scheduler:
    <<: *app
    command: ["python", "-m", "crdo.jobs.scheduler"]
    networks: [data]
    mem_limit: 256m

  postgres:
    image: pgvector/pgvector:${PGVECTOR_TAG:?}
    restart: unless-stopped
    environment:
      POSTGRES_DB: crdo
      POSTGRES_USER: crdo_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?}
    volumes:
      - ${CRDO_DATA_DIR:?}/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    shm_size: 256m
    mem_limit: 2g
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crdo_owner -d crdo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:

networks:
  edge: {}                    # cloudflared <-> caddy (salida a Cloudflare)
  app:                        # caddy <-> api de prod y staging (compartida, sin Internet)
    name: crdo_app            # crear una vez: docker network create --internal crdo_app
    external: true
  data: { internal: true }    # app <-> postgres, sin Internet
  mcp: { internal: true }     # servidores MCP futuros, sin Internet por defecto
  egress: {}                  # salida controlada (Claude API, R2) para api/worker
