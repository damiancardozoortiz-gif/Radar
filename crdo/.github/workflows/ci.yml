# C.R.D.O. — Integración continua (Etapa 1, v3.1). Entorno de pruebas EFÍMERO y aislado:
# cada ejecución arranca una máquina nueva de GitHub, sin secretos ni cuentas reales, y la destruye al terminar.
# Se activa cuando C.R.D.O. viva en su propio repositorio (en `Radar` está en una subcarpeta y GitHub lo ignora).
# Estado: NO ejecutado todavía (no existe el repositorio privado).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PostgreSQL 16, pgvector, restic y shellcheck (mismos paquetes que el servidor)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgvector restic shellcheck
          sudo systemctl stop postgresql || true
      - name: Baterías completas (base de datos, respaldo y recuperación, prototipo, configuración)
        run: sudo CRDO_REPORT="$RUNNER_TEMP/informe.txt" bash tests/run-all.sh
      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: ${{ runner.temp }}/informe.txt
      - name: Buscar secretos accidentales
        run: |
          ! git grep -nE '(sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|tskey-[a-z]+-[A-Za-z0-9]{10,}|crdo_(se|ag)_[0-9a-f]{64}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!*.md'
