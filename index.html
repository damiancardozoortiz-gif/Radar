<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar YouTube</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #0b0d12;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}
header { margin: 12px 0 24px; }
.logo { color: #ff3b4e; font-weight: bold; letter-spacing: 2px; }
h1 { font-size: 30px; margin: 8px 0; }
.sub { color: #a4a9b5; font-size: 14px; }
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.card {
  background: #171b25;
  border: 1px solid #292e3a;
  border-radius: 14px;
  padding: 16px;
}
.label { color: #a4a9b5; font-size: 12px; }
.number { font-size: 25px; font-weight: bold; margin-top: 8px; }
.green { color: #50e3a4; }
h2 { font-size: 18px; margin: 28px 0 14px; }
button {
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 14px;
  background: #ff354a;
  color: white;
  font-weight: bold;
  font-size: 15px;
  margin-top: 16px;
}
.video {
  background: #171b25;
  border: 1px solid #292e3a;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
.video-title { font-weight: bold; margin-bottom: 8px; }
.video-info { color: #a4a9b5; font-size: 13px; line-height: 1.7; }
.tag { color: #50e3a4; font-weight: bold; }
.notice { color: #a4a9b5; font-size: 12px; line-height: 1.5; margin-top: 18px; }
</style>
</head>
<body>

<header>
  <div class="logo">● RADAR YOUTUBE</div>
  <h1>Radar de viralidad</h1>
  <div class="sub">Encontrá videos que empiezan a despegar.</div>
</header>

<div class="stats">
  <div class="card">
    <div class="label">VIDEOS MONITOREADOS</div>
    <div class="number" id="total">3</div>
  </div>
  <div class="card">
    <div class="label">EN OBSERVACIÓN</div>
    <div class="number green" id="alertas">1</div>
  </div>
</div>

<h2>🔥 Radar de tendencias</h2>
<div id="lista"></div>

<button onclick="actualizar()">Actualizar radar de prueba</button>

<div class="notice">
  Versión inicial de prueba. Los videos y las métricas son ficticios:
  todavía no estamos conectados a YouTube.
</div>

<script>
const videos = [
  {
    titulo: "El hábito que puede cambiar tu vida",
    vistas: 125000,
    crecimiento: 18.6,
    velocidad: 2400
  },
  {
    titulo: "Tres errores que frenan tu progreso",
    vistas: 48200,
    crecimiento: 7.2,
    velocidad: 420
  },
  {
    titulo: "Una idea que nadie te explica",
    vistas: 8900,
    crecimiento: 24.5,
    velocidad: 680
  }
];

function formato(n) {
  return new Intl.NumberFormat("es-AR").format(n);
}

function dibujar() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  const ordenados = [...videos].sort(
    (a, b) => b.crecimiento - a.crecimiento
  );

  ordenados.forEach((v, i) => {
    lista.innerHTML += `
      <div class="video">
        <div class="video-title">${i + 1}. ${v.titulo}</div>
        <div class="video-info">
          Vistas: ${formato(v.vistas)}<br>
          Crecimiento simulado: <span class="tag">+${v.crecimiento.toFixed(1)}%</span><br>
          Velocidad simulada: ${formato(v.velocidad)} vistas/hora
        </div>
      </div>`;
  });
}

function actualizar() {
  videos.forEach(v => {
    v.vistas += Math.floor(Math.random() * 500);
    v.crecimiento += Math.random() * 2;
    v.velocidad = Math.floor(100 + Math.random() * 3000);
  });

  document.getElementById("total").textContent = videos.length;
  document.getElementById("alertas").textContent =
    videos.filter(v => v.crecimiento > 20).length;
